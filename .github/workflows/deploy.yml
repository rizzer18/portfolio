name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build and restart
        run: |
          cd /home/milfhunterlinux/potrfolio
          git pull origin main
          docker compose up -d --build
          docker image prune -f
